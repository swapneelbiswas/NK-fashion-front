        - password
    UserRegisterResponseUser:
      description: User data in the response
      type: object
      properties:
        full_name:
          type: string
          description: Full name of the user
        last_login:
          type: string
          description: Timestamp of the user's last login (JST)
        password_hash:
          type: string
          description: Hashed password of the user
        role:
          type: string
          default: '1'
          description: Role of the user (管理者 | リーダー | スタッフ)
        user_email:
          type: string
          description: User email.
        user_status:
          type: string
          default: '1'
          description: User status (使用中 | 非使用)
      required:
        - full_name
        - last_login
        - password_hash
        - role
        - user_email
        - user_status
    UserRegisterResponse:
      description: Response body returned after successfully registering a new user.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        user:
          $ref: '#/components/schemas/UserRegisterResponseUser'
          description: user data that has been created
        user_id:
          type: string
          description: id of the user that has been created
        job_id:
          type: string
          description: id of the job that is creating the user and notify uid
      required:
        - status_code
        - result
        - user
        - user_id
        - job_id
