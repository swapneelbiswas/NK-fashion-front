        payloadFormatVersion: '2.0'
  /delivery_request/get_completed_delivery:
    get:
      tags:
        - DeliveryRequests
      summary: Get Completed delivery lists
      parameters:
        - name: limit
          description: limit of the data to be returned
          in: query
          required: true
          schema:
            type: string
            default: '10'
        - name: page
          description: number of page to be returned
          in: query
          required: true
          schema:
            type: string
            default: '1'
        - name: branch_id
          description: branch_id
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: total_count
          description: total number of hospital
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: hospital_id
          description: Hospital id
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: patient_name
          description: Patient name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: classification_name
          description: Partial search on classification_name. Used when requesting
            user is HOSPITAL_STAFF (role '3').
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: start_date
          description: start date of this query
          in: query
          required: false
          schema:
            type: string
        - name: end_date
          description: end date of this query
          in: query
          required: false
          schema:
            type: string
        - name: data_section
          description: 'Only evaluated for HOSPITAL_STAFF (role ''3''). Allowed values:
            TODAY, TOMORROW, DAY_AFTER_TOMORROW. When provided, overrides start_date/end_date
            for that role.'
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: sort_by
          description: 'Column to sort by. One of: service_name, kana_name, patient_name,
            room_number, classification_name. Falls back to default ordering when
            omitted or unrecognized.'
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: sort_direction
          description: 'Sort direction: ''asc'' or ''desc''.'
          in: query
          required: true
          schema:
            type: string
            default: desc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedDeliveryResponse'
      x-amazon-apigateway-integration:
