        payloadFormatVersion: '2.0'
  /branch:
    get:
      tags:
        - Branches
      summary: Get branches
      parameters:
        - name: branch_id
          description: Optional filter for branch id
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: limit
          description: limit of the data to be returned
          in: query
          required: true
          schema:
            type: string
            default: '10'
        - name: page
          description: number of page to be returned
          in: query
          required: true
          schema:
            type: string
            default: '1'
        - name: total_count
          description: total number of branch
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: name_search
          description: Text to search branch name or address
          in: query
          required: false
          schema:
            type: string
            default: null
      responses:
        '200':
          description: Successful Response
