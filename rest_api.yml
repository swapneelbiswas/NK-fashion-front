    get:
      tags:
        - Health Check
      summary: Health check endpoint (/health-check)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OK to receive requests
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:000000000000:function:koyama-shokai-lambda-function-dev:versions/invocations
        payloadFormatVersion: '2.0'
  /health-check/ready-new:
