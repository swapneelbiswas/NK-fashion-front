          in: query
          required: true
          schema:
            type: string
        - name: total_count
          description: total number of hospital
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: building_name
          description: Building name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: patient_name
          description: Patient name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: service_name
          description: Service name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: option_name
          description: Option name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: floor_number
          description: Floor name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: room_number
          description: Room number
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: route_name
          description: Route name
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: sort_by
          description: 'Column to sort by. One of: kana_name, building_name, floor_number,
            route_name, room, service_name. Falls back to default ordering when omitted
            or unrecognized.'
          in: query
          required: false
          schema:
            type: string
            default: null
        - name: sort_direction
          description: 'Sort direction: ''asc'' or ''desc''.'
          in: query
          required: true
          schema:
            type: string
            default: desc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
