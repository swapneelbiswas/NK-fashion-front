components:
  schemas:
    AclActionRequest:
      description: ''
      type: object
      properties:
        role_id:
          type: string
        action:
          type: string
      required:
        - role_id
        - action
    AclPermissionItem:
      description: ''
      type: object
      properties:
        role_id:
          type: string
        role_name:
          type: string
        allowed_actions:
          type: array
          items:
            type: string
        allowed_pages:
          type: array
          items:
            type: string
      required:
        - role_id
        - role_name
        - allowed_actions
        - allowed_pages
    AclListResponse:
      description: ''
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AclPermissionItem'
      required:
        - status_code
        - result
        - permissions
    AclPageRequest:
      description: ''
      type: object
      properties:
        role_id:
          type: string
        page:
          type: string
      required:
        - role_id
        - page
    AclJobResponse:
      description: ''
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        job_id:
          type: string
      required:
        - status_code
        - result
        - job_id
    AuthLoginRequest:
      description: Request body for user login.
      type: object
      properties:
        user_id:
          type: string
          default: null
          description: id of the user, used for admin and leader login
        role:
          type: string
          description: Role of the user (admin, leader, staff)
        password:
          type: string
          description: Plain text password for the user (will be hashed)
        branch_code:
          type: string
          default: null
          description: Short code of the branch, used for staff login
        hospital_code:
          type: string
          default: null
          description: Short code of the hospital, used for staff login
        device_id:
          type: string
          default: null
          description: Browser UUID from localStorage for device tracking
        ip_address:
          type: string
          default: null
          description: Client IP address
        user_agent:
          type: string
          default: null
          description: Browser User-Agent string
      required:
        - role
        - password
    AuthLoginResponsePermission:
      description: Permission information returned upon successful login.
      type: object
      properties:
        role_id:
          type: string
          description: id of the role permission
        role_name:
          type: string
          description: name of the role
        allowed_actions:
          type: array
          items:
            type: string
          description: list of actions that are allowed to perform by this user
        allowed_pages:
          type: array
          items:
            type: string
          description: list of pages that are allowed to be seen by this user
      required:
        - role_id
        - role_name
        - allowed_actions
        - allowed_pages
    AuthLoginResponseHospital:
      description: Hospital information when user log in as staff
      type: object
      properties:
        hospital_id:
          type: string
          description: Primary key for the hospital
        hospital_name:
          type: string
          description: Hospital name
        branch_id:
          type: string
          description: Branch ID (foreign key)
        branch_name:
          type: string
          description: Branch name
        hospital_status:
          type: string
          default: null
          description: 'Hospital status: 使用中 or 非使用'
        responsibility_status:
          type: string
          default: null
          description: 'Responsibility status: 担当中 or 非担当'
      required:
        - hospital_id
        - hospital_name
        - branch_id
        - branch_name
    AuthLoginResponseUser:
      description: User information returned upon successful login.
      type: object
      properties:
        user_id:
          type: string
          description: ID of the user
        user_email:
          type: string
          description: Email address of the user
        role:
          type: string
          description: User role (管理者 | リーダー | スタッフ)
        full_name:
          type: string
          description: Full name of the user
        user_status:
          type: string
          description: User status (使用中 | 非使用)
        last_login:
          type: string
          description: Last login timestamp (JST)
      required:
        - user_id
        - user_email
        - role
        - full_name
        - user_status
    AuthLoginResponse:
      description: Response body returned after a successful user login.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        role:
          type: string
          description: The role of the user who logged in (管理者 | リーダー | スタッフ)
        user_name:
          type: string
          description: The role of the user who logged in (管理者 | リーダー | スタッフ)
        login_id:
          type: string
          default: null
          description: The ID the user logged in with
        branch_name:
          type: string
          default: null
          description: The branch name if the logged in user is a leader
        permission:
          $ref: '#/components/schemas/AuthLoginResponsePermission'
          description: permission that are allowed for this user
      required:
        - status_code
        - result
        - role
        - user_name
        - permission
    AuthLogoutRequest:
      description: Request body for logging out a user.
      type: object
      properties:
        player_id:
          type: string
          default: null
          description: player id of the user
    AuthLogoutResponse:
      description: Response body returned after a successful user logout.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        message:
          type: string
          description: logout success message
      required:
        - status_code
        - result
        - message
    AuthWhoAmIResponse:
      description: Response returned with role and permissions information of the
        specified user.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        role_id:
          type: string
          description: id of the role permission
        role_name:
          type: string
          description: name of the role
        allowed_actions:
          type: array
          items:
            type: string
          description: list of actions that are allowed to perform by this user
        allowed_pages:
          type: array
          items:
            type: string
          description: list of pages that are allowed to be seen by this user
        full_name:
          type: string
          description: display name of the user
        login_id:
          type: string
          description: The ID the user logged in with
        hospital_id:
          type: string
          description: UUID of the hospital (koyama staff and hospital staff only)
        hospital_code:
          type: string
          description: Short code identifying the hospital (koyama staff and hospital
            staff only)
        branch_id:
          type: string
          description: UUID of the branch (leader, koyama staff, and hospital staff
            only)
        branch_code:
          type: string
          description: Short code identifying the branch (leader, koyama staff, and
            hospital staff only)
        is_demo:
          type: boolean
          description: True when this session is scoped to the demo schema
      required:
        - status_code
        - result
        - role_id
        - role_name
        - allowed_actions
        - allowed_pages
        - full_name
        - is_demo
    CreateBranchRequest:
      description: Request body for user password reset.
      type: object
      properties:
        branch_code:
          type: string
          minLength: 4
          maxLength: 8
          description: Unique short code for the branch (4-8 characters)
        branch_id:
          type: string
          description: ID of the branch
        branch_name:
          type: string
          description: Name of the branch
      required:
        - branch_code
        - branch_id
        - branch_name
    CreateBranchResponse:
      description: Response body returned after a successful user password reset.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        branch_id:
          type: string
          description: id of the user that has been created
        job_id:
          type: string
          description: id of the job that is creating the user and notify uid
      required:
        - status_code
        - result
        - branch_id
        - job_id
    BranchListResponseBranch:
      description: Branch information returned upon successful login.
      type: object
      properties:
        id:
          type: string
          description: Unique primary key of the branch
        branch_id:
          type: string
          description: User defined ID of the branch
        branch_code:
          type: string
          description: Short code for the branch
        branch_name:
          type: string
          description: Branch name
      required:
        - id
        - branch_id
        - branch_code
        - branch_name
    BranchListResponse:
      description: Response body returned after a successful user login.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        total_count:
          type: integer
          description: total number of data found
        branch_list:
          type: array
          items:
            $ref: '#/components/schemas/BranchListResponseBranch'
          description: Id of newly created user
      required:
        - status_code
        - result
        - total_count
        - branch_list
    BranchUpdateRequest:
      description: Request body of branch update
      type: object
      properties:
        id:
          type: string
          description: Partition key of the branch
        branch_code:
          type: string
          description: Short code for the branch
        branch_id:
          type: string
          description: Required Branch ID
        branch_name:
          type: string
          default: null
          description: New name of the branch
      required:
        - id
        - branch_code
        - branch_id
    BranchUpdateResponse:
      description: Response body returned after successfully updating branch.
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        message:
          type: string
          description: Branch update api response
        job_id:
          type: string
          description: id of the job that is creating the branch and notify uid
      required:
        - status_code
        - result
        - message
        - job_id
    DataClearRequest:
      description: ''
      type: object
      properties:
        table_name:
          type: string
          description: Name of the table to clear
        id:
          type: string
          default: null
          description: ID of the specific record to delete. Required when all_clear
            is False.
        all_clear:
          type: boolean
          description: True to delete every row in the table; False to delete only
            the row with the given id.
      required:
        - table_name
        - all_clear
    DataClearResponse:
      description: ''
      type: object
      properties:
        status_code:
          type: integer
          enum:
            - 200
        result:
          type: string
          enum:
            - OK
        table_name:
          type: string
          description: Table that was targeted
        deleted_count:
          type: integer
          description: Number of rows deleted
      required:
        - status_code
        - result
        - table_name
        - deleted_count
    CompletedDeliveryOptionIdModel:
      description: Option with quantity
      type: object
      properties:
        id:
          type: string
          description: delivery_list_options.id — the row on this delivery request;
            use this for any update, delete or reference
        option_id:
          type: string
          default: null
          description: Human-readable options.option_id from the master record.
            Null for legacy records.
        master_option_id:
          type: string
          default: null
          description: Master options.id UUID (delivery_list_options.source_option_id).
            Null for legacy records.
        option_name:
          type: string
          default: null
          description: Option name
        option_type:
          type: string
          default: null
          description: 'Option type: 日額 or 販売'
        quantity:
          type: integer
          description: Quantity of the option
        option_unit_price:
          type: integer
          default: null
          description: unit price of the option delivery
        option_total_day_count:
          type: integer
          default: null
          description: Total number of delivery made in days
        option_total_bill:
          type: integer
          default: null
          description: Total consolidated bill for this option delivery
      required:
        - id
        - quantity
    CompletedDeliveryServiceIdModel:
      description: Service with date range and sub-services
      type: object
      properties:
        id:
          type: string
          description: delivery_list_services.id — the row on this delivery request;
            use this for any update, delete or reference
        service_id:
          type: string
          default: null
          description: Human-readable services.service_id from the master record.
            Null for legacy records.
        master_service_id:
          type: string
          default: null
          description: Master services.id UUID (delivery_list_services.source_service_id).
            Null for legacy records.
        start_date:
          type: string
          description: Service start date
        end_date:
          type: string
          description: Service end date
        service_name:
          type: string
          default: null
          description: Service name
        service_unit_price:
          type: integer
          default: null
          description: unit price of this service delivery
        service_total_day_count:
          type: integer
          default: null
          description: Total days count made for this service delivery
        service_total_bill:
          type: integer
          default: null
          description: Total consolidated bill for this service delivery
      required:
        - id
        - start_date
        - end_date
    CompletedDeliveryResponseDeliveryList:
      description: Delivery request information returned in the delivery request list
        response.
      type: object
      properties:
        completed_delivery_list_id:
          type: string
          description: ID of the delivery list
        branch_id:
          type: string
          description: Branch ID (foreign key)
        delivery_date:
          type: string
          description: Delivery date in ISO 8601 format (YYYY-MM-DD)
        delivery_list_status:
          type: string
          description: Status of the delivery list
        hospital_id:
          type: string
          description: Hospital ID (foreign key)
        hospital_name:
          type: string
          description: Hospital name
        room_id:
          type: string
          default: null
          description: Room ID associated with the delivery; null for HOSPITAL_STAFF
            delivery lists
        delivery_list_option_ids:
          type: array
          items:
            type: string
          default: null
          description: delivery_list_options.id values this delivery covers;
            null when the line is a service
        delivery_list_service_id:
          type: string
          default: null
          description: delivery_list_services.id this delivery covers; null when
            the line is an option
      required:
        - completed_delivery_list_id
        - branch_id
        - delivery_date
        - delivery_list_status
        - hospital_id
        - hospital_name
    CompletedDeliveryRoom:
      description: Room information associated with the delivery request (ADMIN_STAFF
        delivery lists)
      type: object
      properties:
        room_id:
          type: string
          default: null
          description: id of the room; null for HOSPITAL_STAFF delivery lists
        floor_number:
          type: string
          default: '-'
          description: Floor name (e.g., 1階)
        route_name:
          type: string
          default: '-'
          description: Route name (e.g., A-ルート)
        building_name:
          type: string
          default: '-'
          description: Building name (e.g., 西)
        room_number:
          type: array
          items:
            type: string
          description: Room numbers (e.g., ['101', '201'])
      required:
        - floor_number
        - route_name
        - building_name
        - room_number
    CompletedDeliverySuspensionPeriod:
      description: Suspension period associated with a HOSPITAL_STAFF delivery list.
      type: object
      properties:
        suspension_start_date:
          type: string
          description: Suspension start date (YYYY-MM-DD)
        suspension_end_date:
          type: string
          description: Suspension end date (YYYY-MM-DD)
      required:
        - suspension_start_date
        - suspension_end_date
    CompletedDeliveryResponseInfo:
      description: Delivery request information returned in the delivery request list
        response.
      type: object
      properties:
        request_id:
          type: string
          description: ID of the delivery list
        user_type:
          type: string
          description: '''2'' (ADMIN_STAFF) or ''3'' (HOSPITAL_STAFF)'
        room_id:
          type: string
          default: null
          description: Room ID associated with the delivery; null for HOSPITAL_STAFF
            delivery lists
        room_number:
          type: string
          default: null
          description: Room number; null for HOSPITAL_STAFF delivery lists
        room:
          $ref: '#/components/schemas/CompletedDeliveryRoom'
