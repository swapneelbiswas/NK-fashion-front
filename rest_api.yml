    UpdateDeliveryRequestRequest:
      description: 'Request body for updating a delivery request (full-replacement
        semantics). The frontend sends the complete desired state; the service diffs
        it against the current state and applies the minimum set of SQL operations.
        Exactly one location group must be populated, matching the original user_type:
        ADMIN_STAFF → room_id + room_number_id HOSPITAL_STAFF → classification_id
        + classification_room_id'
      type: object
      properties:
        request_id:
          type: string
          description: delivery_lists.id to update
        room_id:
          type: string
          default: null
          description: rooms.id (UUID string). Required when the delivery list is
            ADMIN_STAFF type.
        room_number_id:
          type: string
          default: null
          description: room_room_numbers.id (UUID string). Required when ADMIN_STAFF
            type.
        classification_id:
          type: string
          default: null
          description: hospital_classifications.id (UUID string). Required when HOSPITAL_STAFF
            type.
        classification_room_id:
          type: string
          default: null
          description: classification_rooms.id (UUID string). Required when HOSPITAL_STAFF
            type.
        patient_surname:
          type: string
          description: Patient surname
        patient_name:
          type: string
          description: Patient given name
        kana_surname:
          type: string
          description: Patient kana surname
        kana_name:
          type: string
          description: Patient kana given name
        service_ids:
          type: array
          items:
            $ref: '#/components/schemas/ServiceIdRequest'
          description: Complete list of services with date ranges for this delivery
            request
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionIdRequest'
          description: Complete list of options with quantities and individual delivery
            dates
        postal_code:
          type: string
          default: null
          description: Patient postal code
        prefecture:
          type: string
          default: null
          description: Patient prefecture
        city:
          type: string
          default: null
          description: Patient city
        suburb:
          type: string
          default: null
          description: Patient suburb / district
        remaining_address:
          type: string
          default: null
          description: Remaining address after city/suburb
        home_phone_number:
          type: string
          default: null
          description: Patient home phone number
        cell_phone_number:
          type: string
          default: null
          description: Patient cell phone number
        notes:
          type: string
          default: null
          description: Additional notes for the delivery request
      required:
        - request_id
        - patient_surname
        - patient_name
        - kana_surname
        - kana_name
        - service_ids
        - options
