<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NK Fashions — Luxury Ethnic Boutique</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tenor+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .app-boot-loader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #1b363c;
      }

      .app-boot-loader-spinner {
        position: relative;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 3px solid rgba(212, 175, 55, 0.15);
        border-top-color: #d4af37;
        animation: app-boot-loader-spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }

      .app-boot-loader-spinner::before,
      .app-boot-loader-spinner::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }

      .app-boot-loader-spinner::before {
        inset: 9px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #e8eff1;
        animation: app-boot-loader-spin 1.2s linear infinite reverse;
      }

      .app-boot-loader-spinner::after {
        inset: 20px;
        border: 2px solid rgba(212, 175, 55, 0.1);
        border-top-color: #cca43b;
        animation: app-boot-loader-spin 1.6s linear infinite;
      }

      @keyframes app-boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-boot-loader-overlay">
        <div class="app-boot-loader-spinner"></div>
      </div>
    </app-root>
  </body>
</html>
