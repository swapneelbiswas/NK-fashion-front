<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NK Fashions — Luxury Ethnic Boutique</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link href="assets/css/all.min.css" rel="stylesheet" />
    <style>
      .app-boot-loader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }

      .app-boot-loader-spinner {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.18);
        border-top-color: #3b82f6;
        animation: app-boot-loader-spin 0.8s linear infinite;
      }

      .app-boot-loader-spinner::before,
      .app-boot-loader-spinner::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }

      .app-boot-loader-spinner::before {
        inset: 11px;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #93c5fd;
        animation: app-boot-loader-spin 1.3s linear infinite reverse;
      }

      .app-boot-loader-spinner::after {
        inset: 24px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #bfdbfe;
        animation: app-boot-loader-spin 1.9s linear infinite;
      }

      @keyframes app-boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-boot-loader-overlay">
        <div class="app-boot-loader-spinner"></div>
      </div>
    </app-root>
  </body>
</html>
